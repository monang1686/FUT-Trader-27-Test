name: Publish Market Catalog 6.1
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: publish-market-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'monang1686/FUT-Trader-27-Test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/smart_market_filter.py
      - run: python3 scripts/build_market_catalog.py --pages 100 --output /tmp/market-catalog.json
      - name: Validate and publish only catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path("market-catalog.json")
          new=json.loads(Path("/tmp/market-catalog.json").read_text())
          stamp=datetime.fromisoformat(new["quoteTimestamp"])
          assert -300 <= (datetime.now(timezone.utc)-stamp).total_seconds() <= 5400
          assert len(new["cards"]) >= 1000
          assert len({c["eaId"] for c in new["cards"]}) == len(new["cards"])
          if p.exists():
              old=json.loads(p.read_text())
              if stamp < datetime.fromisoformat(old["quoteTimestamp"]) or (stamp == datetime.fromisoformat(old["quoteTimestamp"]) and len(new["cards"]) <= len(old["cards"])):
                  print("No newer snapshot; keeping existing catalog")
                  raise SystemExit(0)
              print(f"Coverage: previous={len(old['cards'])}, new={len(new['cards'])}")
              assert len(new["cards"]) >= 0.95 * len(old["cards"]), "Catalog coverage regression exceeds 5%"
              if len(new["cards"]) < len(old["cards"]):
                  print("Limited coverage reduction accepted; missing cards are not carried forward as fresh quotes")
          p.write_text(json.dumps(new,ensure_ascii=False),encoding="utf-8")
          PY
          python3 -m unittest discover -s scripts -p catalog_history.py
          python3 scripts/catalog_history.py
          python3 -m unittest discover -s scripts -p market_timing_statistics.py
          python3 scripts/market_timing_statistics.py
          git add -- market-timing-statistics.json market-catalog.json market-catalog-history.json market-catalog-analysis.json market-archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update experimental PS5 catalog"
          git push origin HEAD:main
