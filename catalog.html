<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUT Trader 27 | Catalogo</title><style>body{font:16px system-ui;background:#101d35;color:#fff;margin:16px}input,select{font:inherit;padding:10px;width:100%;box-sizing:border-box;margin:6px 0;border-radius:8px}article{background:#203451;padding:12px;margin:8px 0;border-radius:10px}small{color:#c7d3e4}strong{color:#efcb78}</style><h1>Catalogo mercato PS5</h1><p>Quotazioni indicative, non verificate. Nessun segnale di acquisto.</p><label>Carica catalogo JSON <input id="file" type="file" accept=".json"></label><p id="status" role="status">Carica il file generato dal workflow.</p><input id="q" placeholder="Nome o versione" aria-label="Cerca"><input id="budget" type="number" min="0" placeholder="Budget massimo (facoltativo)" aria-label="Budget massimo"><select id="state" aria-label="Stato"><option value="candidate">Candidate</option><option value="all">Tutte</option><option value="excluded">Escluse</option><option value="unknown">Da verificare</option></select><main id="results"></main><button id="more">Mostra altre</button><script>
const el=id=>document.getElementById(id);let cards=[],limit=50;
function render(){const q=el('q').value.toLowerCase(),b=el('budget').value,s=el('state').value;const filtered=cards.filter(c=>(s==='all'||c.state===s)&&String(c.name+' '+c.rarity+' '+c.overall).toLowerCase().includes(q)&&(!b||(Number.isFinite(c.quote)&&c.quote<=Number(b))));el('results').replaceChildren();for(const c of filtered.slice(0,limit)){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=[c.name,c.overall,c.rarity].join(' · ');const p=document.createElement('p');p.textContent=c.state==='candidate'&&Number.isFinite(c.quote)?c.quote.toLocaleString('it-IT')+' crediti indicativi':c.state==='excluded'?'Esclusa dal trading':'Da verificare';a.append(h,p);el('results').append(a)}el('more').hidden=filtered.length<=limit;}
el('file').onchange=async()=>{try{const f=el('file').files[0];if(!f||f.size>10000000)throw Error('File non valido');const d=JSON.parse(await f.text());if(!Array.isArray(d.cards))throw Error('Schema non valido');cards=d.cards;el('status').textContent=cards.length+' carte · snapshot '+new Date(d.quoteTimestamp).toLocaleString('it-IT')+' · catalogo parziale';limit=50;render()}catch(e){cards=[];el('status').textContent=e.message;render()}};
for(const id of ['q','budget','state'])el(id).oninput=()=>{limit=50;render()};el('more').onclick=()=>{limit+=50;render()};render();
</script></html>
