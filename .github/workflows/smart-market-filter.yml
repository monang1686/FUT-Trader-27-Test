name: Smart Market Filter
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/smart_market_filter.py'
      - '.github/workflows/smart-market-filter.yml'
permissions:
  contents: read
jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/smart_market_filter.py
      - name: Check live sample without publication
        run: |
          cd scripts
          python3 - <<'PY'
          from smart_market_filter import classify
          from full_catalog_tradeability_probe import fetch, PRICE, decode, get
          from collections import Counter
          import time
          prices = decode(get(PRICE))
          rows = {}
          for page in range(1,7):
              obj = fetch({"page":page})
              for row in obj["data"]:
                  i = row.get("eaId")
                  if type(i) is int:
                      if i in rows and rows[i] != row:
                          raise ValueError("Duplicate identity")
                      rows[i] = row
              if not obj.get("next"):
                  break
              time.sleep(1)
          counts = Counter(classify(row, prices.get(i)) for i,row in rows.items())
          print("SUMMARY", dict(counts), "total", len(rows))
          for i in (50572286,50578894,67316992):
              if i in rows:
                  print("TARGET", i, rows[i].get("cardName"), classify(rows[i],prices.get(i)))
          assert rows, "Empty catalog"
          PY
