<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUT Trader 27 | Catalogo</title><style>body{font:16px system-ui;background:#101d35;color:#fff;margin:16px}input,select{font:inherit;padding:10px;width:100%;box-sizing:border-box;margin:6px 0;border-radius:8px}article{background:#203451;padding:12px;margin:8px 0;border-radius:10px}small{color:#c7d3e4}strong{color:#efcb78}</style><h1>Catalogo mercato PS5</h1><p>Quotazioni indicative, non verificate. Nessun segnale di acquisto.</p><p><a href="index.html" style="color:#efcb78">← Torna a FUT Trader</a></p><button id="refresh">Aggiorna catalogo</button><details><summary>Importazione manuale di emergenza</summary><label>Carica catalogo JSON <input id="file" type="file" accept=".json"></label></details><p id="status" role="status">Caricamento catalogo automatico…</p><input id="q" placeholder="Nome o versione" aria-label="Cerca"><input id="budget" type="number" min="0" placeholder="Budget massimo (facoltativo)" aria-label="Budget massimo"><select id="state" aria-label="Stato"><option value="candidate">Candidate</option><option value="all">Tutte</option><option value="excluded">Escluse</option><option value="unknown">Da verificare</option></select><label for="mode">Modalità</label><select id="mode"><option value="all">Catalogo</option><option value="saved">Watchlist personale</option><option value="gold">Sniper Gold · candidati indicativi</option></select><p id="watchStatus" role="status"></p><main id="results"></main><button id="more">Mostra altre</button><script>
const el=id=>document.getElementById(id);let cards=[],limit=50,analysis={},snapshotCount=0;
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem("fut27CatalogWatch")||"[]"))}catch{}
let stamp=0;
function eligible(c){const v=analysis[String(c.eaId)];return Date.now()-stamp<=5400000&&Date.now()-stamp>=-300000&&c.state==="candidate"&&v?.status==="watch"&&v.netAtQuote>=200&&v.roi>=5}
function render(){const q=el('q').value.toLowerCase(),b=el('budget').value,s=el('state').value;const mode=el('mode').value;el('watchStatus').textContent=mode==='gold'?'Solo margini teorici positivi; verifica il Compra ora su EA.':saved.size+' carte salvate';const filtered=cards.filter(c=>(mode==='all'||(mode==='saved'&&saved.has(String(c.eaId)))||(mode==='gold'&&eligible(c)))&&(s==='all'||c.state===s)&&String(c.name+' '+c.rarity+' '+c.overall).toLowerCase().includes(q)&&(!b||(Number.isFinite(c.quote)&&c.quote<=Number(b))));if(mode==='gold')filtered.sort((a,b)=>analysis[String(b.eaId)].roi-analysis[String(a.eaId)].roi);el('results').replaceChildren();if(!filtered.length)el('results').textContent='Nessuna carta corrispondente ai filtri.';for(const c of filtered.slice(0,limit)){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=[c.name,c.overall,c.rarity].join(' · ');const p=document.createElement('p');p.textContent=c.state==='candidate'&&Number.isFinite(c.quote)?c.quote.toLocaleString('it-IT')+' crediti indicativi':c.state==='excluded'?'Esclusa dal trading':'Da verificare';a.append(h,p);if(c.state==='candidate'){const info=document.createElement('small');const v=analysis[String(c.eaId)];info.textContent=v?'Campioni: '+v.samples+' · Rivendita indicativa: '+v.sellReference+' · Margine netto al prezzo rilevato: '+v.netAtQuote+' · ROI '+v.roi+'% · '+(v.status==='watch'?'Da osservare':'Attendere'):'Storico insufficiente per valutare il margine';a.append(info)}if(c.state==='candidate'){const key=String(c.eaId),btn=document.createElement('button');btn.type='button';btn.style.cssText='display:block;margin-top:12px;padding:10px;border-radius:8px';btn.textContent=saved.has(key)?'★ Rimuovi dalla watchlist':'☆ Salva in watchlist';btn.onclick=()=>{if(saved.has(key))saved.delete(key);else saved.add(key);try{localStorage.setItem('fut27CatalogWatch',JSON.stringify([...saved]))}catch{}render()};a.append(btn)}el('results').append(a)}el('more').hidden=filtered.length<=limit;}
function loadData(d){if(!Array.isArray(d.cards)||!Number.isFinite(Date.parse(d.quoteTimestamp)))throw Error('Schema non valido');cards=d.cards;stamp=Date.parse(d.quoteTimestamp);const age=Math.floor((Date.now()-Date.parse(d.quoteTimestamp))/60000);el('status').textContent=cards.length+' carte · '+new Date(d.quoteTimestamp).toLocaleString('it-IT',{timeZone:'Europe/Rome'})+' · '+(age>90||age< -5?'QUOTAZIONI NON ATTUALI':age+' min fa')+' · catalogo parziale';limit=50;render()}
async function refresh(){try{const r=await fetch('market-catalog.json',{cache:'no-store'});if(!r.ok)throw Error('Catalogo non ancora pubblicato');const d=await r.json();analysis={};snapshotCount=0;try{const ar=await fetch('market-catalog-analysis.json',{cache:'no-store'});if(ar.ok){const a=await ar.json();if(a.quoteTimestamp===d.quoteTimestamp&&Date.now()-Date.parse(d.quoteTimestamp)<=5400000&&Date.now()-Date.parse(d.quoteTimestamp)>=-300000){analysis=a.cards||{};snapshotCount=a.snapshots||0}}}catch{}loadData(d);el('status').textContent+=' · '+snapshotCount+' snapshot storici'}catch(e){cards=[];el('status').textContent=e.message;render()}}
el('refresh').onclick=refresh;
el('file').onchange=async()=>{try{const f=el('file').files[0];if(!f||f.size>10000000)throw Error('File non valido');const d=JSON.parse(await f.text());analysis={};snapshotCount=0;loadData(d)}catch(e){cards=[];el('status').textContent=e.message;render()}};
for(const id of ['q','budget','state','mode'])el(id).oninput=()=>{limit=50;render()};el('more').onclick=()=>{limit+=50;render()};render();refresh();setInterval(refresh,300000);
</script></html>
