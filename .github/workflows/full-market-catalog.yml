name: Full Market Catalog 6.0
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_market_catalog.py'
      - '.github/workflows/full-market-catalog.yml'
      - 'catalog.html'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/smart_market_filter.py
      - run: python3 scripts/build_market_catalog.py --pages 40
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-market-catalog
          path: |
            market-catalog.json
            catalog.html
