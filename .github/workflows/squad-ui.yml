name: Squad UI 6.5.6
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check squad-ui.js
      - run: |
          node <<'JS'
          const assert=require('node:assert/strict'),{optimize,F,advise,alternatives,visionMatches,visionUnique,squadAdvisor,competitiveUpgrade}=require('./squad-ui.js');
          for(const [name,expected] of Object.entries({'4-3-3 (2)':'LW ST RW CM CM CDM LB CB CB RB GK','4-2-1-3':'LW ST RW CAM CDM CDM LB CB CB RB GK','4-3-1-2':'ST ST CAM CM CM CM LB CB CB RB GK','4-4-1-1':'ST CAM LM CM CM RM LB CB CB RB GK'})) assert.equal(F[name].flat().join(' '),expected);
          const pos=F['4-3-3'].flat();
          const stats=Object.fromEntries(['facePace','faceShooting','facePassing','faceDribbling','faceDefending','facePhysicality','gkFaceDiving','gkFaceHandling','gkFaceKicking','gkFaceReflexes','gkFaceSpeed','gkFacePositioning'].map(k=>[k,80]));
          const cards=pos.map((position,i)=>({eaId:i+1,overall:80,state:'candidate',quote:100,squad:{eaId:i+1,baseId:i+1,position,stats,league:1,club:1,nation:1,special:false}}));
          const x=optimize(cards,pos,1100,[]);
          assert.equal(x.cost,1100);assert.equal(x.ch,33);
          assert.equal(optimize(cards,pos,1099,[]),null);
          assert.equal(optimize(cards,pos,1100,[2]),null);
          assert.equal(advise(cards[0].squad,pos[0],3).length,3);
          assert.equal(advise(cards[0].squad,pos[0],0).length,0);
          const extra={...cards[0],eaId:99,quote:90,squad:{...cards[0].squad,eaId:99,baseId:99}};
          assert.equal(alternatives([...cards,extra],x.slots,0,pos[0],1100,[])[0].c.eaId,99);
          assert.equal(alternatives([...cards,extra],x.slots,0,pos[0],1089,[]).length,0);
          cards[0].state='excluded';
          assert.equal(optimize(cards,pos,1000,[],[1],{0:1}).cost,1000);
          assert.equal(optimize(cards,pos,1000,[],[1],{0:2}),null);assert.equal(optimize(cards,pos,1100,[]),null);
          const p={rating:90,nation:'Spain',club:'Barcelona',league:'Liga F',cardPosition:'CM'};
          const vc=[{eaId:101,overall:90,squad:{position:'CM',nationName:'Spain',clubName:'Barcelona',leagueName:'Liga F'}},{eaId:102,overall:90,squad:{position:'CM',nationName:'Norway',clubName:'Barcelona',leagueName:'Liga F'}}];
          assert.equal(visionUnique(visionMatches(vc,p,'CM')).eaId,101);
          assert.equal(visionUnique(visionMatches(vc,{rating:90},'CM')),null);
          assert.equal(visionUnique(visionMatches([...vc,{...vc[0],eaId:103}],p,'CM')),null);
          assert.equal(visionMatches(vc,{rating:90},'GK').length,0);
          assert.equal(visionMatches([...vc,{eaId:104,overall:90,squad:{position:'GK'}}],{rating:90},'GK')[0].c.eaId,104);
          const italian={rating:86,nation:'Inghilterra',club:'Manchester United',league:'Premier League',cardPosition:'ATT',version:'Rttk'};
          const english={eaId:201,overall:86,rarity:'Road to the Knockouts',squad:{position:'ST',nationName:'England',clubName:'Manchester United',leagueName:'Premier League'}};
          assert.equal(visionUnique(visionMatches([english],italian,'ST')).eaId,201);
          assert.equal(visionMatches([english],italian,'ST')[0].evidence,5);
          const upgrade={...cards[1],eaId:500,overall:90,quote:500,squad:{...cards[1].squad,eaId:500,baseId:500,stats:Object.fromEntries(Object.keys(stats).map(k=>[k,90]))}};
          const report=squadAdvisor([upgrade],x.slots,pos,500,[]);
          assert.equal(report.picks[0].gain,10);
          assert.equal(squadAdvisor([upgrade],x.slots,pos,499,[]).picks.length,0);
          assert.equal(report.base,33);
          assert.equal(competitiveUpgrade(cards[1],{...upgrade,overall:79},pos[1]),null);
          assert.equal(competitiveUpgrade(cards[1],{...upgrade,squad:{...upgrade.squad,stats}},pos[1]).gain,2.5);
          assert.equal(squadAdvisor([upgrade],x.slots.map((c,i)=>i===0?{...c,squad:{...c.squad,special:true}}:c),pos,500,[]).picks[0].conditional,true);
          console.log('Browser optimizer, vision and advisor: checks passed');
          JS
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('id="squad"')==1
          assert 'href="#squad"' in s and 'src="squad-ui.js?v=' in s
          PY
