name: Quick FUT Price Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream client
        run: pip install 'git+https://github.com/WilgotM/quick-fut-price.git@main'
      - name: Probe five players
        run: python scripts/quick_price_diagnostic_v2.py
