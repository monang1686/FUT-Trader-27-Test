name: Full Catalog Pagination Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/full_catalog_pagination_probe.py
      - .github/workflows/full-catalog-pagination.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/full_catalog_pagination_probe.py
