name: Full Catalog Tradeability Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/full_catalog_tradeability_probe.py'
      - '.github/workflows/full-catalog-tradeability-diagnostic.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/full_catalog_tradeability_probe.py
